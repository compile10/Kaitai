# This docker-compose.yml file is used to for local development.
# Do not use this file for production or for self-hosting. It is not secure.

services:
  # ── Next.js dev server (SSR) ──────────────────
  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source for hot-reload; exclude node_modules
      # so the container uses its own installed copy.
      - ./src:/app/src
      - ./common:/app/common
      - ./public:/app/public
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - ./biome.json:/app/biome.json
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgres://kaitai:kaitai@postgres:5432/kaitai
      - BETTER_AUTH_URL=http://localhost:3000
      - WATCHPACK_POLLING=true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ── Schema migrations; runs once per `docker compose up` ──
  migrate:
    build:
      context: .
      target: dev
    volumes:
      - ./postgres/migrations:/app/postgres/migrations
      - ./scripts:/app/scripts
    environment:
      - DATABASE_URL=postgres://kaitai:kaitai@postgres:5432/kaitai
    command: ["npm", "run", "--silent", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # ── PostgreSQL ──
  postgres:
    build:
      context: ./postgres
    environment:
      - POSTGRES_USER=kaitai
      - POSTGRES_PASSWORD=kaitai
      - POSTGRES_DB=kaitai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaitai -d kaitai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
