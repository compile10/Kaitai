# Production stack for a single host: Next.js, PostgreSQL, and a Cloudflare Tunnel.
# No ports are published; all public traffic arrives through the tunnel.
# POSTGRES_PASSWORD comes from deploy/.env. See docs/deployment.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-database-url: &database-url DATABASE_URL=postgres://kaitai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/kaitai

services:
  web:
    build:
      context: ..
      target: runner
    env_file: .env.production
    environment:
      - *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  # Applies pending schema migrations before web starts.
  migrate:
    build:
      context: ..
      target: builder
    environment:
      - NODE_ENV=production
      - *database-url
    command: ["npm", "run", "--silent", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    build:
      context: ../postgres
    environment:
      - POSTGRES_USER=kaitai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      - POSTGRES_DB=kaitai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaitai -d kaitai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # Outbound-only connector; routes kaitai.app to http://web:3000.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: .env.tunnel
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # One-off: docker compose -f deploy/compose.yml run --rm seed
  seed:
    profiles: ["tools"]
    build:
      context: ..
      target: builder
    environment:
      - NODE_ENV=production
      - *database-url
      - ADMIN_EMAIL
      - ADMIN_NAME
      - ADMIN_PASSWORD
    command: ["npm", "run", "--silent", "seed:admin"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
