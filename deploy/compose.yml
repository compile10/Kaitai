# Production stack for a single host: Next.js, MongoDB, and a Cloudflare Tunnel.
# No ports are published; all public traffic arrives through the tunnel.
# See docs/deployment.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ..
      target: runner
    env_file: .env.production
    environment:
      - MONGODB_URI=mongodb://mongo:27017/kaitai?replicaSet=rs0&directConnection=true
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  mongo:
    image: mongo:7
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--quiet",
        "--wiredTigerCacheSizeGB",
        "0.25",
        "--setParameter",
        "logComponentVerbosity={network:{verbosity:-1}}",
      ]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); }
        "
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # Outbound-only connector; routes kaitai.app to http://web:3000.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: .env.tunnel
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # One-off: docker compose -f deploy/compose.yml run --rm seed
  seed:
    profiles: ["tools"]
    build:
      context: ..
      target: builder
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/kaitai?replicaSet=rs0&directConnection=true
      - ADMIN_EMAIL
      - ADMIN_NAME
      - ADMIN_PASSWORD
    command: ["npm", "run", "--silent", "seed:admin"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
